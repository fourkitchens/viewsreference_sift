name: CI

on:
  pull_request:
  push:
    branches:
      - 1.0.x

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer config --global repositories.drupal composer https://packages.drupal.org/8
      - run: composer install --no-interaction
      - run: vendor/bin/phpcs
      - run: git ls-files -- ':!LICENSE.txt' ':!tests/patches/*.patch' | npx --yes cspell@8.19.4 --no-progress --file-list stdin

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Drupal and analysis dependencies
        run: |
          composer create-project 'drupal/recommended-project:^11' "$RUNNER_TEMP/site" --no-install --no-interaction
          cd "$RUNNER_TEMP/site"
          composer config minimum-stability beta
          composer config prefer-stable true
          composer config repositories.viewsreference-sift path "$GITHUB_WORKSPACE"
          composer require --no-interaction --with-all-dependencies 'drupal/viewsreference_sift:*@dev' 'drupal/core-dev:^11'
      - name: Run PHPStan
        working-directory: ${{ runner.temp }}/site
        run: vendor/bin/phpstan analyze --configuration=web/modules/contrib/viewsreference_sift/phpstan.neon.dist --no-progress

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lowest
            drupal: '11.3.20'
            php: '8.3'
            viewsreference: '2.0.0-beta14'
          - name: latest-11
            drupal: '^11'
            php: '8.4'
          - name: viewsreference-dev
            drupal: '^11'
            php: '8.4'
            viewsreference: '2.x-dev'
            allow_failure: true
          - name: drupal-12 (pending upstream)
            drupal: '^12.0@beta'
            php: '8.5'
            # Make this blocking and restore ^12 once it passes without the Views Reference patches.
            experimental: true
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Locate Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.name }}-php${{ matrix.php }}-${{ hashFiles('composer.json', '.github/workflows/ci.yml') }}
      - name: Install Drupal and test dependencies
        env:
          EXPERIMENTAL: ${{ matrix.experimental == true }}
          DRUPAL_VERSION: ${{ matrix.drupal }}
          VIEWSREFERENCE_VERSION: ${{ matrix.viewsreference || '*' }}
        run: |
          composer create-project "drupal/recommended-project:$DRUPAL_VERSION" "$RUNNER_TEMP/site" --no-install --no-interaction
          cd "$RUNNER_TEMP/site"
          composer config minimum-stability beta
          composer config prefer-stable true
          composer config repositories.viewsreference-sift path "$GITHUB_WORKSPACE"
          if [ "$EXPERIMENTAL" = true ]; then
            # Allow Drupal 12 only in the disposable CI checkout.
            composer --working-dir="$GITHUB_WORKSPACE" require --no-update "drupal/core:$DRUPAL_VERSION"
            sed -i 's/^core_version_requirement: .*/core_version_requirement: ^12/' \
              "$GITHUB_WORKSPACE/viewsreference_sift.info.yml" \
              "$GITHUB_WORKSPACE/tests/modules/viewsreference_sift_test/viewsreference_sift_test.info.yml"
            # Drupal 12 release archives omit the test bootstrap.
            composer config preferred-install.drupal/core source
          fi
          composer require --no-interaction --with-all-dependencies \
            'drupal/viewsreference_sift:*@dev' \
            "drupal/core-recommended:$DRUPAL_VERSION" \
            "drupal/core-composer-scaffold:$DRUPAL_VERSION" \
            "drupal/core-dev:$DRUPAL_VERSION" \
            "drupal/viewsreference:$VIEWSREFERENCE_VERSION"
      - name: Apply the Views Reference test patches
        if: matrix.experimental == true
        working-directory: ${{ runner.temp }}/site
        # cspell:ignore cweagans repatch
        run: |
          cp "$GITHUB_WORKSPACE/tests/patches/viewsreference-attribute.patch" \
            "$GITHUB_WORKSPACE/tests/patches/viewsreference-cacheability.patch" \
            "$GITHUB_WORKSPACE/tests/patches/viewsreference-widget-return.patch" .
          cat > patches.json <<'EOF'
          {
            "patches": {
              "drupal/viewsreference": {
                "Support setting attribute discovery": "viewsreference-attribute.patch",
                "Use the merged cache metadata on PHP 8.5": "viewsreference-cacheability.patch",
                "Match the Drupal 12 widget return type": "viewsreference-widget-return.patch"
              }
            }
          }
          EOF
          composer config allow-plugins.cweagans/composer-patches true
          composer require --dev --no-interaction 'cweagans/composer-patches:^2'
          composer patches-repatch --no-interaction
      - name: Run unit and kernel tests
        working-directory: ${{ runner.temp }}/site
        env:
          EXPERIMENTAL: ${{ matrix.experimental == true }}
          SIMPLETEST_DB: sqlite://localhost/${{ runner.temp }}/test.sqlite
          BROWSERTEST_OUTPUT_DIRECTORY: ${{ runner.temp }}
        run: |
          if [ "$EXPERIMENTAL" = true ] &&
            composer show --locked drupal/core 12.0.0-beta2 --quiet 2>/dev/null; then
            # Drupal core #3634044 fixes the debug loader after beta 2.
            export DRUPAL_DEPRECATION_FILTER_CONFIG='{"enableDebugClassLoader":false}'
          fi
          vendor/bin/phpunit -c web/core --display-deprecations \
            web/modules/contrib/viewsreference_sift/tests/src/Unit \
            web/modules/contrib/viewsreference_sift/tests/src/Kernel

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - name: Install Drupal and browser test dependencies
        run: |
          composer create-project 'drupal/recommended-project:^11' "$RUNNER_TEMP/site" --no-install --no-interaction
          cd "$RUNNER_TEMP/site"
          composer config minimum-stability beta
          composer config prefer-stable true
          composer config repositories.viewsreference-sift path "$GITHUB_WORKSPACE"
          composer require --no-interaction --with-all-dependencies 'drupal/viewsreference_sift:*@dev' 'drupal/core-dev:^11'
      - name: Run functional and JavaScript tests
        working-directory: ${{ runner.temp }}/site
        env:
          SIMPLETEST_DB: sqlite://localhost/${{ runner.temp }}/browser.sqlite
          SIMPLETEST_BASE_URL: http://127.0.0.1:8080
          BROWSERTEST_OUTPUT_DIRECTORY: ${{ runner.temp }}/site/web/sites/simpletest/browser_output
          MINK_DRIVER_ARGS_WEBDRIVER: >-
            ["chrome", {"goog:chromeOptions": {"w3c": true, "args": ["--headless=new", "--no-sandbox", "--window-size=1280,1024"]}}, "http://127.0.0.1:4444"]
        # cspell:ignore chromedriver
        run: |
          mkdir -p "$BROWSERTEST_OUTPUT_DIRECTORY"
          (cd web && exec php -S 127.0.0.1:8080 .ht.router.php) > "$BROWSERTEST_OUTPUT_DIRECTORY/php-server.log" 2>&1 &
          server_pid=$!
          chromedriver --port=4444 > "$BROWSERTEST_OUTPUT_DIRECTORY/chromedriver.log" 2>&1 &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --output /dev/null "$SIMPLETEST_BASE_URL"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --output /dev/null http://127.0.0.1:4444/status
          vendor/bin/phpunit -c web/core --display-deprecations \
            web/modules/contrib/viewsreference_sift/tests/src/Functional \
            web/modules/contrib/viewsreference_sift/tests/src/FunctionalJavascript
      - name: Upload browser output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: ${{ runner.temp }}/site/web/sites/simpletest/browser_output
